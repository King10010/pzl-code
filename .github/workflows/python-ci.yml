name: Python CI Test

on:
  push:
    branches: [ "dev", "master" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  python-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest -q
